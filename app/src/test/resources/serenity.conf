serenity {
  project.name = "Serenity Kotlin Framework"
  take.screenshots = FOR_FAILURES
  logging = QUIET
  use.unique.browser = false
  restart.browser.for.each = SCENARIO
  store.html = NEVER
  tag.failures = true
  linked.tags = issue
}

webdriver {
  driver = chrome
  base {
    url = "https://bikeleasing.de"
  }
}


chrome {
  switches =
    "--headless=new;--window-size=1920,1080;--disable-web-security"
}

api {
  base {
    url = "https://catfact.ninja"
  }
  facts{
   uri = "/facts"
  }
}
